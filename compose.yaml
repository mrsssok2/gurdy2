# Gurdy 2.0 — one compose file, one profile per part.
# RAM rule: run only ONE heavy profile at a time (sim / rl / ops).
#
#   docker compose build sim
#   docker compose up sim                     # walking robot in Gazebo GUI (WSLg)
#   docker compose run --rm sim bash          # interactive shell in the sim image
#   docker compose run --rm sim scripts/check_display.sh
#   docker compose --profile '*' down         # stop everything (plain `down` skips profiles)

x-wslg: &wslg
  environment:
    DISPLAY: ${DISPLAY:-:0}
    WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
    XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
    PULSE_SERVER: unix:/mnt/wslg/PulseServer
    # OpenGL via WSL GPU: Mesa d3d12 → DirectX → host GPU (measured: RTX 4050 Laptop).
    # Fallback to CPU rendering:  GZ_GALLIUM_DRIVER=llvmpipe docker compose up sim
    LD_LIBRARY_PATH: /usr/lib/wsl/lib
    GALLIUM_DRIVER: ${GZ_GALLIUM_DRIVER:-d3d12}
    # WSL exposes both GPUs to d3d12; headless EGL picked the Intel iGPU by default.
    MESA_D3D12_DEFAULT_ADAPTER_NAME: ${GPU_ADAPTER:-NVIDIA}
    QT_QPA_PLATFORM: xcb          # Qt over X11 (XWayland) is more reliable than native Wayland here
    QT_X11_NO_MITSHM: "1"
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    # Discovery stays inside each container, so two sims never cross-talk. Override with
    # ROS_DISCOVERY_RANGE=SUBNET when containers must talk (rosbridge/web, later phases).
    ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_DISCOVERY_RANGE:-LOCALHOST}
    PYTHONPATH: /home/ubuntu/gurdy2/gurdy_core   # pure-Python core importable everywhere
  devices:
    - /dev/dxg

services:
  sim:
    profiles: [sim]
    image: gurdy2/ros:jazzy
    build:
      context: docker/ros
    <<: *wslg
    volumes:
      - /mnt/wslg:/mnt/wslg
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix   # host /tmp/.X11-unix is empty on this distro
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - .:/home/ubuntu/gurdy2
    ports:
      - "8080:8080"       # reserved: rosbridge / web UI (later phases)
    mem_limit: 6g         # keep headroom inside WSL's 8 GB
    init: true
    stdin_open: true
    tty: true
    # Walking robot in Gazebo (builds the workspace on first run). Drive it from a second
    # terminal:  docker compose exec sim bash  ->  ros2 run teleop_twist_keyboard ...
    command: ["/home/ubuntu/gurdy2/scripts/start_sim.sh"]

  # Phase 5 brain: agent + tool layer + mock world + eval harness (no ROS / GPU).
  #   docker compose run --rm brain python3 -m pytest -q brain/tests
  #   docker compose run --rm brain python3 -m brain.eval.run --agent keyword
  brain:
    profiles: [brain]
    image: gurdy2/brain:cpu
    environment:
      # Ollama of the WSL distro, port 11435 (11434 may be a Windows Ollama!):
      #   OLLAMA_HOST=0.0.0.0:11435 ollama serve ;  OLLAMA_URL=http://$(hostname -I | cut -d' ' -f1):11435 docker compose run ...
      OLLAMA_URL: ${OLLAMA_URL:-}
    build:
      context: docker/brain
    volumes:
      - .:/home/ubuntu/gurdy2

  # Phase 5.8 live voice: PulseAudio tools + faster-whisper (CPU). Mic/speaker through WSLg. See scripts/mic_test.sh
  voice:
    profiles: [voice]
    image: gurdy2/voice:cpu
    build:
      context: docker/voice
    environment:
      PULSE_SERVER: unix:/mnt/wslg/PulseServer
      OLLAMA_URL: ${OLLAMA_URL:-}
      PYTHONPATH: /home/ubuntu/gurdy2:/home/ubuntu/gurdy2/gurdy_core
    volumes:
      - .:/home/ubuntu/gurdy2
      - /mnt/wslg:/mnt/wslg
      - ${HOME}/p5_models:/models:ro

  # RL training (Phase 2): headless MuJoCo + SB3. Never run together with `sim` (RAM rule).
  #   docker compose run --rm rl python3 rl/bench.py
  #   docker compose run --rm --service-ports rl tensorboard --logdir runs --bind_all   # :6006
  rl:
    profiles: [rl]
    image: gurdy2/rl:cpu
    build:
      context: docker/rl
    environment:
      MESA_D3D12_DEFAULT_ADAPTER_NAME: ${GPU_ADAPTER:-NVIDIA}   # EGL video rendering via WSL GPU
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: ${GZ_GALLIUM_DRIVER:-d3d12}
    volumes:
      - .:/home/ubuntu/gurdy2
      - /usr/lib/wsl:/usr/lib/wsl:ro
    devices:
      - /dev/dxg
    ports:
      - "6006:6006"       # TensorBoard
    mem_limit: 6g
    shm_size: 1g          # SubprocVecEnv pipes / torch
    init: true
    stdin_open: true
    tty: true

  # Vision (Phase 4): YOLO training / ONNX export / eval on the RTX 4050. Needs the NVIDIA runtime of Docker Desktop.
  #   docker compose build vision && docker compose run --rm vision nvidia-smi
  #   docker compose run --rm vision python3 vision/train.py --data datasets/synth_v1 --name det_v1
  # One GPU workload at a time (6 GB VRAM) and not together with Gazebo / RL training (8 GB RAM budget).
  vision:
    profiles: [vision]
    image: gurdy2/vision:cuda
    build:
      context: docker/vision
    volumes:
      - .:/home/ubuntu/gurdy2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 6g
    shm_size: 2g
    init: true
    stdin_open: true
    tty: true
