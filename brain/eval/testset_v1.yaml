# Gurdy Brain test set v1 — 100 English commands in the mock flat_lab world (docs/phase5_design.md section 5.1).
#
# Format
#   cat        category 1-9 (design table); noise: synthetic marks hand-written STT errors (see note below)
#   scenario   mock-world setup (brain/eval/harness.py build_world): explored (default true = all objects seen, both rooms
#              mapped, robot at home facing +x), seen [gids], pose {place | x,y,yaw_deg}, battery, fail_legs, zones, pre
#   turns      say, stt (confidence), advance_s (let the mission run N virtual s instead of settling), settle,
#              expect {behaviour, calls, reply_has, reply_has_any, reply_lacks, reply_re, reply_no_number, distance_to_gid},
#              state (predicates checked after the turn)
#   behaviour  execute | answer | clarify | refuse | confirm | none
#   calls      allowed tool traces (list of alternatives; each a list of {tool, args}). args are matched as a subset;
#              numbers within a tolerance. `[]` = no tool call expected. ask_user is ignored when comparing traces.
#   end_state  predicates after the last turn: at, at_xy(+tol), near_object, yaw_deg, found, mission, idle, not_moved, zones, mapped
#
# World (flat_lab): home (0,0) facing +x; room A x -2..2.5, room B x 2.5..6.5, doorway at (2.5, 0.5); objects:
# red box (1.0,1.6), blue box (1.8,-2.2), green barrel (4.5,1.6), yellow box (4.6,-1.5), red fire extinguisher
# (5.8,-2.5), grey mannequin (3.6,2.3). No toolbox / chair / traffic cone exist (probes for "not seen").
#
# NOTE on category 9: the STT errors below are written by hand in the style of Whisper confusions (homophones, dropped
# letters). They are NOT recorded Whisper output. Milestone 5.5 replaces them with real transcripts.
# Templates / phrasings / object-place combinations of this file are held out from the training-data generator (5.4).

cases:
