# PLANNED, NOT USED YET (Phase 3 ships ground-truth odometry). robot_localization EKF fusing
# IMU + leg/kinematic odometry. Leg odometry node (gurdy_navigation, TODO) must publish
# /odom/legs (nav_msgs/Odometry: vx, vy, wz from foot stance-phase motion). Enable with
# odom_source:=ekf once that node exists. See docs/phase3_navigation.md.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom/legs
    odom0_config: [false, false, false,  false, false, false,
                   true,  true,  false,  false, false, true,
                   false, false, false]
    imu0: /imu
    imu0_config: [false, false, false,  false, false, true,
                  false, false, false,  false, false, true,
                  true,  true,  false]
    imu0_remove_gravitational_acceleration: true
