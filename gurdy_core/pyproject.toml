[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gurdy_core"
version = "0.1.0"
description = "Gurdy 2.0 pure-Python core: robot.yaml loader, leg kinematics, gait math (no ROS)"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
include = ["gurdy_core*"]

[tool.setuptools.package-data]
gurdy_core = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
