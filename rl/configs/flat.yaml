# Phase 2 training config: flat ground, no domain randomisation (steps 2.2-2.4).
env:
  episode_s: 20.0
  command_period_s: 5.0        # command resampled every 5 s
  resample_command: true
  zero_command_prob: 0.15
  action_scale: {hip_yaw: 0.3, hip_pitch: 0.7, knee: 0.6}   # rad per unit action (tripod needs 0.47/0.56/0.51)
  init_joint_noise: 0.05       # rad, uniform, at reset

reward:
  kappa: 0.8                   # tracking sigma = kappa * |command| (annealed to 0.5 in training)
  sigma_v_floor: 0.02          # m/s   (zero / pure-turn commands)
  sigma_w_floor: 0.05          # rad/s
  air_time_target: 0.2         # s
  track_filter_s: 0.2          # s, EMA of the tracked body velocity (stride surge); 0 = instantaneous
  only_positive: true          # r = max(0, sum except fall) + fall (falling early can't beat surviving)
  penalty_scale: 1.0           # set by training.penalty_curriculum during training
  weights:
    track: 1.5                 # dominant: exp(-|e_v|^2/s_v^2 - e_w^2/s_w^2)
    alive: 0.05                # small on purpose (Gurdy 1.0: standing must never pay)
    fall: -10.0                # once, at a fall
    tilt: -1.0                 # |gravity_xy|^2 in body frame
    vz: -1.0                   # vertical bounce
    ang_xy: -0.05              # roll/pitch rate
    energy: -2.0e-3            # sum |tau * qdot| (W)
    torque: -5.0e-4            # sum tau^2
    joint_acc: -2.5e-7         # sum qddot^2
    action_rate: -0.01         # sum (a - a_prev)^2
    foot_slip: -1.0            # sum over stance feet |v_foot_xy|^2
    air_time: 0.5              # per touchdown: (air time - target), only when moving
    stand_still: -0.1          # sum |q - q_stance|, only at zero command

ppo:
  n_workers: 10                # BatchedSubprocVecEnv: 10 processes x 4 envs = 40 envs (step 2.1 benchmark)
  envs_per_worker: 4
  n_steps: 512                 # per env -> 20,480 samples per update
  batch_size: 5120
  n_epochs: 5
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0005             # small: no violent exploration
  vf_coef: 0.5
  max_grad_norm: 1.0
  target_kl: 0.03              # stop update epochs early if the policy moves too far
  net_arch: [256, 256]         # separate actor and critic MLPs
  log_std_init: -1.05          # ln(0.35): low initial action noise
  torch_threads: 2             # more threads starved the env workers (step 2.1)
  normalize_obs: true
  normalize_reward: true

training:
  total_timesteps: 60000000
  checkpoint_every: 2000000
  kappa_anneal: {start: 0.8, end: 0.5, from_step: 10000000, to_step: 40000000}
  # shaping penalties (tilt, vz, ang_xy, energy, torque, joint_acc, action_rate, foot_slip) x scale
  penalty_curriculum: {start: 0.1, end: 1.0, from_step: 0, to_step: 15000000}
