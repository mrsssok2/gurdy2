# Named places for the flat_lab world (map frame = world frame: the robot spawns at the origin, SLAM starts there).
# Used by brain.ros.RosBackend. Rooms are rectangles [xmin, ymin, xmax, ymax] (goal = centre); waypoints are points.
map_id: flat_lab
places:
  home: {x: 0.0, y: 0.0, kind: waypoint}
  room a: {rect: [-2.0, -3.0, 2.5, 3.0], kind: room}
  room b: {rect: [2.5, -3.0, 6.5, 3.0], kind: room}
  doorway: {x: 2.5, y: 0.5, kind: waypoint}
